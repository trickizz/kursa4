{% extends 'contests/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
    <div class="card fade-up">
        <div class="card-header grad text-center py-4">
            <span class="brand-logo mx-auto mb-2" style="width:52px;height:52px;font-size:1.4rem"><i class="bi bi-trophy-fill"></i></span>
            <h4 class="mb-0">Вход в систему</h4>
        </div>
        <div class="card-body p-4">
            <form method="post" novalidate>
                {% csrf_token %}
                {% if form.errors %}<div class="alert alert-danger"><i class="bi bi-x-octagon me-1"></i>Неверный логин или пароль.</div>{% endif %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Логин</label>
                    <input type="text" name="username" id="id_username" class="form-control" required autofocus placeholder="Введите логин">
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" id="id_password" class="form-control" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Войти</button>
            </form>
            <div class="text-center mt-3"><a href="{% url 'password_reset' %}" style="font-size:.85rem">Забыли пароль?</a></div>
            <hr class="my-4">
            <div class="text-center">
                <p class="text-muted mb-2" style="font-size:.88rem">Нет аккаунта?</p>
                <a href="{% url 'register' %}" class="btn btn-soft w-100"><i class="bi bi-person-plus me-1"></i>Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div></div>
{% endblock %}
